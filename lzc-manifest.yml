application:
  subdomain: anqicms
  multi_instance: false
  upstreams:
    - location: /package-licenses/
      backend: file:///lzcapp/pkg/content/licenses/
    - location: /
      backend: http://anqicms:8001/

services:
  anqicms:
    # upstream: anqicms/anqicms:v3.6.7
    image: docker.1ms.run/anqicms/anqicms:v3.6.7
    environment:
      - TZ=Asia/Shanghai
    binds:
      # SQLite database, uploaded media, templates and the install lock live here
      - /lzcapp/var/data:/app/data
      - /lzcapp/var/public:/app/public
      - /lzcapp/var/template:/app/template

usage: |
  安企CMS 是企业级内容管理系统，用 Go 写成。做企业站、行业站、跨境多语言站点都合适：多站点统一管理，内容发布、模板、SEO 设置都在一个后台里。

  使用方法：
  1. 打开应用，第一次会进入**安装向导**。填好站点信息、管理员账号和密码
     （密码至少 6 位），点安装。
  2. 安装完成后访问 `/system` 进入后台，用你刚设置的账号登录。
  3. 在后台新建栏目、发布文章，选一套模板就能出站。多站点可以在后台切换管理。

  数据与安全：
  - 数据库、上传的图片附件、模板都在 /lzcapp/var 下，卸载会一并删除，请定期备份。
  - **管理员账号由你在安装向导里自己设置**，装完向导会关闭
    （成功后写入 installed.lock，再次访问会跳回首页）。
  - 上游镜像里预置了一个 admin/123456 的默认账号，只在"数据库已连接但没有管理员"
    这种非向导路径下才会生成。**本包走的是安装向导，用的就是你填的密码。**
    如果你发现后台能直接被 admin/123456 登录进去，说明向导没走完，请立刻改密码。
  - 应用经懒猫入口鉴权访问。

  说明：
  - 单容器 + 内置 SQLite，不需要额外数据库。
  - 镜像以 root 运行，数据以文件形式存在容器内，未做额外的权限隔离。
  - 首次访问走安装流程，装完才会生成内容表，别急着并发访问。
  - 未做真机验证：安装向导、后台登录、发布内容以及重启后数据留存
    均未在设备上实测。
